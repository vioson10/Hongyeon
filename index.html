
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홍연 · 붉은 실 연애사주</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--gold:#d9b46a;--ink:#0b0507;--txt:#f3e9e4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at top,#2a0710 0%,var(--ink) 60%) fixed;color:var(--txt);font-family:'Noto Sans KR',sans-serif;overflow-x:hidden}
.wrap{max-width:440px;margin:0 auto;padding:0 20px 130px}
.serif{font-family:'Gowun Batang',serif}
.scene{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:24px;opacity:0;transform:translateY(30px);transition:1.1s}
.scene.show{opacity:1;transform:none}
h1{font-family:'Gowun Batang',serif;font-size:56px;color:var(--red);text-shadow:0 0 22px rgba(200,16,46,.8);letter-spacing:8px}
.big{font-size:25px;line-height:1.65;font-weight:700}
.em{color:#ff3b55}
.glyph{font-family:'Gowun Batang',serif;font-size:96px;color:var(--red);text-shadow:0 0 30px var(--red);animation:pulse 2.4s infinite}
@keyframes pulse{50%{text-shadow:0 0 8px var(--red);opacity:.75}}
.bubble{background:rgba(235,225,225,.88);color:#1a0a0d;border-radius:50%;padding:36px 30px;font-size:18px;max-width:230px;line-height:1.6}
.thread{width:2px;height:150px;background:linear-gradient(var(--red),transparent);box-shadow:0 0 12px var(--red);transform-origin:top;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(5deg)}}
.card{background:linear-gradient(160deg,#2b0a12,#14060a);border:1px solid #5a1a24;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 0 30px rgba(200,16,46,.15)}
.card h3{font-family:'Gowun Batang',serif;color:var(--gold);font-size:20px;margin-bottom:14px;text-align:center}
label{display:block;font-size:14px;color:#c9aeb2;margin:14px 0 6px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #5a1a24;background:#1a080c;color:var(--txt);font-size:16px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#b9999e;margin-top:8px}
.chk input{width:auto}
.btn,.cta{width:100%;padding:17px;border:1px solid var(--gold);border-radius:14px;background:linear-gradient(#4a0b17,#200508);color:#fff;font-family:'Gowun Batang',serif;font-size:19px;letter-spacing:2px;box-shadow:0 0 24px rgba(200,16,46,.45);cursor:pointer;margin-top:20px}
.cta{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;margin:0;z-index:9}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pl small{display:block;font-size:11px;color:#b9999e;margin:4px 0}
.gz{font-size:30px;font-family:serif;font-weight:700;border-radius:8px;padding:6px 0;margin:3px 0;color:#fff}
.e0{background:#2e7d4f}.e1{background:#b8282e}.e2{background:#c9a23a;color:#111}.e3{background:#d8d8d8;color:#111}.e4{background:#24467a}.e5{background:#2a2a2a;color:#777}
.prof div{display:flex;gap:12px;margin:10px 0;align-items:flex-start}
.prof b{flex:0 0 52px;text-align:center;background:#4a0b17;border-radius:20px;padding:3px 0;font-size:13px;color:#ffb3bd}
.yr{display:flex;align-items:center;gap:10px;margin:11px 0;font-size:14px}
.yr span:first-child{flex:0 0 52px}
.bar{flex:1;height:10px;background:#2a1015;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7a1020,#ff3b55)}
.yr span:last-child{flex:0 0 86px;text-align:right;font-size:12px;color:#d9a5ad}
.best{border-left:3px solid var(--red);padding:8px 12px;margin:10px 0;background:rgba(200,16,46,.08);border-radius:0 8px 8px 0}
.best strong{color:#ff6b7f}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;background:#3a0a13;font-size:12px;margin:3px 2px;color:#e8c9ce}
p{line-height:1.8}
.note{font-size:12px;color:#8d7376;text-align:center;margin-top:24px;line-height:1.6}
#result{display:none}
</style>
</head>
<body>
<div class="wrap">
  <section class="scene"><div class="thread"></div><h1>紅緣</h1>
    <p class="big serif">붉은 실 끝에 매달린<br><span class="em">네 다음 인연</span>을 보러 왔구나</p></section>
  <section class="scene"><div class="bubble">새끼손가락에<br>실이 감겨 있네</div><div class="glyph">緣</div></section>
  <section class="scene"><p class="big">그 실의 반대편 끝을<br><span class="em">누군가</span> 쥐고 있어</p>
    <div class="bubble">생각보다<br>가까운 데 있을지도</div></section>
  <section class="scene"><div class="bubble">언제 당겨질지<br>궁금하지?</div>
    <p class="big"><span class="em">언제</span> 만나는지,<br><span class="em">어떤 사람</span>인지까지</p></section>
  <section class="scene"><p class="big serif">전부 네 <span class="em">팔자</span>에 적혀 있어</p>
    <p style="color:#c9aeb2">생년월일만 주면, 실을 따라가 줄게</p></section>

  <section class="card" id="form">
    <h3>네 실타래를 보여줘</h3>
    <label>이름 (닉네임)</label><input id="name" placeholder="예: 민우" maxlength="10">
    <label>성별</label><select id="gender"><option value="f">여성</option><option value="m">남성</option></select>
    <label>생년월일 (양력)</label><input id="bdate" type="date" min="1930-01-01" max="2015-12-31">
    <label>태어난 시간</label><input id="btime" type="time">
    <label class="chk"><input type="checkbox" id="unk"> 시간을 몰라요</label>
    <button class="btn" id="go">실 따라가기</button>
  </section>

  <section class="scene" id="loading" style="display:none"><div class="thread"></div><p class="big serif">실을 따라가는 중…</p></section>
  <div id="result"></div>
</div>
<button class="cta" id="cta">실타래 점술사에게 연애사주 보기</button>

<script>
const G='甲乙丙丁戊己庚辛壬癸',Z='子丑寅卯辰巳午未申酉戌亥',GK='갑을병정무기경신임계',ZK='자축인묘진사오미신유술해';
const EL=['목','화','토','금','수'],ZS=[9,5,0,1,4,2,3,5,6,7,4,8];
const se=s=>Math.floor(s/2),be=b=>se(ZS[b]),$=s=>document.querySelector(s);
const TG=[['비견','겁재'],['식신','상관'],['편재','정재'],['편관','정관'],['편인','정인']];
const tg=(ds,s)=>TG[(se(s)-se(ds)+5)%5][s%2===ds%2?0:1];

function jd(y,m,d,h){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+h/24+B-1524.5}
function sunLon(J){const T=(J-2451545)/36525,r=Math.PI/180,M=(357.52911+35999.05029*T)*r;
  const C=(1.914602-0.004817*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  return ((280.46646+36000.76983*T+C-0.00569-0.00478*Math.sin((125.04-1934.136*T)*r))%360+360)%360}
function calc(y,m,d,hh,mm,known){
  const lon=sunLon(jd(y,m,d,hh+mm/60-9));            // KST → UT
  const mi=Math.floor(((lon-315+360)%360)/30);        // 0 = 寅월 (입춘 315°)
  const sy=(m<=2&&lon>=270&&lon<315)?y-1:y;           // 입춘 전이면 전년도
  const ys=((sy-4)%10+10)%10,yb=((sy-4)%12+12)%12;
  const ms=(ys*2+2+mi)%10,mb=(mi+2)%12;
  const di=(Math.round(jd(y,m,d,12))+49)%60,ds=di%10,db=di%12;
  let h=null;
  if(known){const t=hh*60+mm-30,hb=((Math.floor((t+60)/120))%12+12)%12;h=[(ds*2+hb)%10,hb]}
  return {y:[ys,yb],m:[ms,mb],d:[ds,db],h};
}
function score(s,b,me){
  let sc=0,why=[];
  if((se(s)-se(me.ds)+5)%5===me.star){sc+=2;why.push('인연의 별이 하늘에 뜸')}
  if((be(b)-se(me.ds)+5)%5===me.star){sc+=2;why.push('인연의 별이 땅에 내려옴')}
  if(b===me.dohwa){sc+=2;why.push('도화(桃花)가 피는 때')}
  if((13-me.db)%12===b){sc+=2;why.push('배우자 자리와 합(合)')}
  if((s-me.ds+10)%10===5){sc+=2;why.push('일간과 천간합, 강한 끌림')}
  if((b-me.db+12)%12===6){sc+=1;why.push('배우자 자리가 흔들림, 관계의 변화')}
  return {sc,why};
}
const STYLE=['한번 마음먹으면 곧게 가는 직진형. 다만 자존심 때문에 먼저 굽히질 못해.',
'상대에 맞춰 유연하게 휘는 타입. 대신 서운한 건 오래 기억해.',
'좋으면 다 티 나는 태양형. 뜨겁게 시작하는 만큼 식어 보일 때도 빨라.',
'은근하게 챙기는 촛불형. 겉은 조용한데 속은 누구보다 뜨거워.',
'묵직한 산 같은 타입. 쉽게 안 움직이지만 한번 품으면 끝까지 지켜.',
'상대를 키워주는 밭 같은 사람. 너무 맞춰주다 혼자 지치는 게 문제야.',
'애매한 건 질색인 결단형. 썸보다 확실한 관계를 원해.',
'눈이 높고 섬세한 보석형. 말 한마디에 마음이 열리고 닫혀.',
'자유로운 바다형. 구속은 싫지만 마음 맞는 사람한텐 한없이 깊어져.',
'조용히 스며드는 비 같은 타입. 좋아할수록 티 안 내고 상대 반응부터 살펴.'];
const PF=[['키가 크고 선이 가늘며 손이 예쁜','교육·기획·디자인·의료','다정하지만 자기 계획이 뚜렷한'],
['눈빛이 밝고 웃는 얼굴이 인상적인','미디어·마케팅·서비스·예술','솔직하고 표현이 풍부한'],
['듬직하고 편안한 인상의','공공기관·부동산·중개·컨설팅','느긋하고 한결같은'],
['이목구비가 또렷하고 깔끔한','금융·IT·법률·엔지니어','단호하고 기준이 분명한'],
['눈이 깊고 분위기 있는','연구·무역·콘텐츠·심리','속이 깊고 생각이 많은']];

const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('show')),{threshold:.3});
document.querySelectorAll('.scene').forEach(el=>io.observe(el));
$('#cta').onclick=()=>$('#form').scrollIntoView({behavior:'smooth'});
$('#unk').onchange=e=>$('#btime').disabled=e.target.checked;

$('#go').onclick=()=>{
  const v=$('#bdate').value;if(!v){alert('생년월일을 알려줘');return}
  const [y,m,d]=v.split('-').map(Number),tv=$('#btime').value,known=!$('#unk').checked&&!!tv;
  const [hh,mm]=known?tv.split(':').map(Number):[12,0];
  const name=$('#name').value.trim()||'너',male=$('#gender').value==='m';
  $('#form').style.display='none';$('#cta').style.display='none';
  const L=$('#loading');L.style.display='flex';L.classList.add('show');L.scrollIntoView({behavior:'smooth'});
  setTimeout(()=>{L.style.display='none';render(calc(y,m,d,hh,mm,known),male,name)},2400);
};

function render(P,male,name){
  const ds=P.d[0],db=P.d[1],star=male?2:3,me={ds,db,star,dohwa:[9,6,3,0][db%4]};
  const cols=[['시주',P.h],['일주',P.d],['월주',P.m],['년주',P.y]],cnt=[0,0,0,0,0];let stars=0;
  let h=`<div class="card"><h3>${name}의 팔자</h3><div class="pillars">`;
  cols.forEach(([lb,p])=>{
    if(!p){h+=`<div class="pl"><small>${lb}</small><div class="gz e5">?</div><div class="gz e5">?</div><small>시간 모름</small></div>`;return}
    cnt[se(p[0])]++;cnt[be(p[1])]++;
    if(lb!=='일주'&&(se(p[0])-se(ds)+5)%5===star)stars++;
    if((be(p[1])-se(ds)+5)%5===star)stars++;
    h+=`<div class="pl"><small>${lb==='일주'?'나':tg(ds,p[0])}</small><div class="gz e${se(p[0])}">${G[p[0]]}</div><div class="gz e${be(p[1])}">${Z[p[1]]}</div><small>${tg(ds,ZS[p[1]])}<br>${GK[p[0]]}${ZK[p[1]]}</small></div>`;
  });
  h+=`</div><p style="text-align:center;margin-top:12px">${cnt.map((c,i)=>`<span class="tag">${EL[i]} ${c}</span>`).join('')}</p></div>`;

  h+=`<div class="card"><h3>너의 연애 결</h3><p>${name}, ${STYLE[ds]}</p><p style="margin-top:10px;color:#d9b9be">${
    stars===0?'팔자에 인연의 별이 숨어 있어. 운에서 들어올 때 갑자기 확 당겨지는 타입이야.':
    stars>=3?'인연의 별이 여럿이라 주변에 사람이 끊이지 않아. 고르는 눈이 중요해.':
    '인연의 별이 적당히 떠 있어. 때만 맞으면 자연스럽게 이어져.'}</p></div>`;

  const pf=PF[(se(ds)+star)%5];
  h+=`<div class="card prof"><h3>운명의 상대 프로필</h3><div><b>외모</b><span>${pf[0]} 사람</span></div><div><b>직업</b><span>${pf[1]} 쪽 기운</span></div><div><b>성격</b><span>${pf[2]} 성향</span></div></div>`;

  const now=new Date(),Y0=now.getFullYear();let yrs=[];
  for(let Y=Y0;Y<Y0+5;Y++){const s=((Y-4)%10+10)%10,b=((Y-4)%12+12)%12;yrs.push({Y,s,b,...score(s,b,me)})}
  const lab=sc=>sc>=6?'강하게 당겨짐':sc>=3?'실이 움직임':'잔잔함';
  h+=`<div class="card"><h3>해마다 실이 당겨지는 세기</h3>${yrs.map(r=>`<div class="yr"><span>${r.Y}</span><div class="bar"><i style="width:${Math.max(6,r.sc/11*100)}%"></i></div><span>${G[r.s]}${Z[r.b]} · ${lab(r.sc)}</span></div>`).join('')}</div>`;

  let ms=[];
  for(let i=0;i<12;i++){const dt=new Date(Y0,now.getMonth()+i,20),yy=dt.getFullYear(),mo=dt.getMonth()+1,p=calc(yy,mo,20,12,0,true).m;
    ms.push({yy,mo,p,...score(p[0],p[1],me)})}
  const top=ms.filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc||0).slice(0,3);
  h+=`<div class="card"><h3>가장 세게 당겨지는 달</h3>${top.length?top.map(t=>`<div class="best"><strong>${t.yy}년 ${t.mo}월</strong> (${G[t.p[0]]}${Z[t.p[1]]}월)<br>${t.why.map(w=>`<span class="tag">${w}</span>`).join('')}</div>`).join(''):'<p>앞으로 1년은 실이 조용해. 대신 나를 가꾸기 좋은 때야.</p>'}</div>`;

  const by=yrs.reduce((a,b)=>b.sc>a.sc?b:a);
  h+=`<div class="card" style="text-align:center"><p class="serif" style="font-size:19px">${by.sc>0?`<span class="em">${by.Y}년</span>, 네 실이 가장 세게 당겨져.<br>그때 손 놓지 마.`:'실은 끊어지지 않아.<br>천천히 당겨질 뿐이야.'}</p>
  <button class="btn" onclick="location.reload()">다른 사람 실도 보기</button>
  ${navigator.share?`<button class="btn" onclick="navigator.share({title:'홍연 연애사주',url:location.href})">친구에게 공유하기</button>`:''}</div>
  <p class="note">절기 기준 만세력 · 태어난 시간은 30분 보정<br>재미로 보는 콘텐츠예요. 중요한 결정은 스스로!</p>`;
  const R=$('#result');R.innerHTML=h;R.style.display='block';R.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
