<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>

<body>
<div class="wrap">
<section class="scene"><div class="thread"></div><h1>紅緣</h1>
<p class="big serif">붉은 실 끝에 매달린<br><span class="em">네 다음 인연</span>을 보러 왔구나</p></section>
<section class="scene"><div class="bubble">새끼손가락에<br>실이 감겨 있네</div><div class="glyph">緣</div></section>
<section class="scene"><p class="big">그 실의 반대편 끝을<br><span class="em">누군가</span> 쥐고 있어</p>
<div class="bubble">생각보다<br>가까운 데 있을지도</div></section>
<section class="scene"><div class="bubble">언제 당겨질지<br>궁금하지?</div>
<p class="big"><span class="em">언제</span> 만나는지,<br><span class="em">어떤 사람</span>인지까지</p></section>
<section class="scene"><p class="big serif">전부 네 <span class="em">팔자</span>에 적혀 있어</p>
<p style="color:#c9aeb2">생년월일만 주면, 실을 따라가 줄게</p></section>

<section class="card" id="form">
<h3>네 실타래를 보여줘</h3>
<label>이름 (닉네임)</label><input id="name" placeholder="예: 민우" maxlength="10">
<label>성별</label><select id="gender"><option value="f">여성</option><option value="m">남성</option></select>
<label>생년월일 (양력)</label><input id="bdate" type="date" min="1930-01-01" max="2015-12-31">
<label>태어난 시간</label><input id="btime" type="time">
<label class="chk"><input type="checkbox" id="unk"> 시간을 몰라요</label>
<button class="btn" id="go">실 따라가기</button>
</section>

<section class="scene" id="loading" style="display:none"><div class="thread"></div><p class="big serif">실을 따라가는 중…</p></section>
<div id="result"></div>
</div>
<button class="cta" id="cta">실타래 점술사에게 연애사주 보기</button>

<script>

return ((280.46646+36000.76983T+C-0.00569-0.00478Math.sin((125.04-1934.136T)r))%360+360)%360}

const lon=sunLon(jd(y,m,d,hh+mm/60-9));
const mi=Math.floor(((lon-315+360)%360)/30);
const sy=(m<=2&&lon>=270&&lon<315)?y-1:y;
const ys=((sy-4)%10+10)%10,yb=((sy-4)%12+12)%12;
const ms=(ys2+2+mi)%10,mb=(mi+2)%12;

let h=null;
if(known){const t=hh60+mm-30,hb=((Math.floor((t+60)/120))%12+12)%12;h=[(ds2+hb)%10,hb]}
return {y:[ys,yb],m:[ms,mb],d:[ds,db],h};
}
function score(s,b,me){
let sc=0,why=[],chung=false;
if((se(s)-se(me.ds)+5)%5===me.star){sc+=2;why.push(['인연의 별이 하늘에 뜸','새로운 사람을 만날 기회가 많아. 소개팅이나 모임에 적극적으로 나가 봐.'])}
if((be(b)-se(me.ds)+5)%5===me.star){sc+=2;why.push(['인연의 별이 땅에 내려옴','가까운 곳에서 인연이 생겨. 이미 아는 사람이 다르게 보일 수 있어.'])}
if(b===me.dohwa){sc+=2;why.push(['도화(桃花)가 피는 때','매력이 가장 빛나는 때야. 스타일에 변화를 주면 효과가 커.'])}
if((13-me.db)%12===b){sc+=2;why.push(['배우자 자리와 합(合)','마음이 통하는 사람을 만나기 쉬워. 진지한 관계로 발전할 수 있어.'])}
if((s-me.ds+10)%10===5){sc+=2;why.push(['일간과 천간합, 강한 끌림','강하게 끌리는 사람이 나타나. 첫눈에 반할 수도 있어.'])}
if((b-me.db+12)%12===6){sc+=1;chung=true;why.push(['배우자 자리가 흔들림','관계에 변화가 생겨. 시작이 될 수도, 정리가 될 수도 있어.'])}
return {sc,why,chung};
}
const STYLE=[
['한번 마음먹으면 곧게 가는 직진형이야. 좋아하는 사람이 생기면 그 사람을 중심으로 계획부터 세워.','챙겨주고 이끌어주려 해. 데이트 코스도, 미래 이야기도 네가 먼저 꺼내는 편이야.','자존심 때문에 먼저 굽히질 못해. 다툰 뒤 "미안해" 한마디가 제일 어려운 사람이 너야.'],
['상대에 맞춰 유연하게 휘는 덩굴 같은 타입이야. 분위기를 잘 읽고 상대를 편하게 해줘.','은근히 곁에 머물러. 연락을 자주 하고, 작은 기념일까지 잘 챙겨.','서운한 걸 바로 말하지 않고 쌓아둬. 한 번에 터지기 전에, 그때그때 말하는 연습이 필요해.'],

['상대를 키워주는 밭 같은 사람이야. 함께 있으면 편안해서 상대가 너한테 기대게 돼.','상대의 일상을 세심하게 돌봐. 밥은 먹었는지, 오늘 힘들진 않았는지 꼭 물어.','너무 맞춰주다 혼자 지쳐. 네가 원하는 것도 분명히 말해야 관계가 오래가.'],

['키가 크고 선이 가늘며 손이 예쁜','교육·기획·디자인·의료','다정하지만 자기 계획이 뚜렷한','공부 모임, 학원, 도서관, 지인 소개','처음엔 점잖은데 대화할수록 따뜻함이 느껴져'],

s+=`<br><br>참고로 너는 ${C.S[2]}<br><br>그 사람 생일을 알면 "그 사람이랑 궁합 볼래"를 눌러봐. 더 자세히 봐줄게.`;
botSay(s)},
back(){const hp=C.ms.filter(x=>x.why.some(w=>w[0].includes('합'))),c=C.ms.filter(x=>x.chung);
let s=hp.length?`끊어진 실이 다시 이어질 수 있는 때는 <b>${hp.slice(0,2).map(ym).join(', ')}</b>이야. 합(合)이 드는 달이라 연락이 닿거나 마음이 다시 움직이기 쉬워.`:'앞으로 1년 안에는 다시 묶이는 합(合)의 달이 뚜렷하지 않아. 억지로 잡기보다 시간을 두는 게 좋아.';
if(c.length)s+=`<br><br>${c.map(ym).join(', ')}은 배우자 자리가 흔들리는 달이야. 이때는 감정적으로 연락하지 마.`;
s+=C.stars>=3?'<br><br>네 팔자엔 인연의 별이 많아서, 지난 사람보다 더 잘 맞는 사람이 올 가능성도 커.':'<br><br>다만 사주는 흐름을 보여줄 뿐이야. 다시 만날지는 결국 두 사람의 선택이야.';
botSay(s)},
conf(){const g=C.ms.filter(x=>!x.chung&&x.why.some(w=>/합|땅/.test(w[0]))).slice(0,2),t=g.length?g:C.top.slice(0,1);
let s=t.length?`고백하기 좋은 달은 <b>${t.map(ym).join(', ')}</b>이야. 마음이 통하는 기운이 드는 때라 진심이 잘 전해져.`:'앞으로 1년은 특별히 강한 달이 없어. 그럴 땐 타이밍보다 관계가 충분히 무르익었는지를 기준으로 삼아.';
s+=`<br><br>너한테 맞는 고백 방식은 <b>${CONF[C.ds]}</b>이야.`;
const c=C.ms.filter(x=>x.chung);if(c.length)s+=`<br><br>${c.map(ym).join(', ')}은 피하는 게 좋아. 말이 엇나가기 쉬운 달이야.`;
botSay(s)},
next(){const a=C.ms[0],b=C.ms[1];
botSay(`<b>이번 달(${a.mo}월)</b>은 ${lab(a.sc)}. ${a.why.length?a.why.map(w=>w[1]).join(' '):'큰 움직임 없이 잔잔한 달이야.'}<br><br><b>다음 달(${b.mo}월)</b>은 ${lab(b.sc)}. ${b.why.length?b.why.map(w=>w[1]).join(' '):'조용한 달이야. 나를 가꾸고 사람들과 가볍게 어울리는 데 써.'}`)},
weak(){let s=`${C.name}, 너는 ${C.S[2]}`;
s+=C.miss.length?'<br><br>'+C.miss.map(i=>WEAK[i]).join('<br><br>'):`<br><br>오행이 고루 있는 편이라 큰 구멍은 없어. 다만 ${EL[C.mx]} 기운이 가장 강해서, 그 성향이 지나치지 않게만 조심해.`;
s+='<br><br>단점은 고치는 것보다 알고 있는 게 더 중요해. 알면 같은 실수를 덜 하게 돼.';
botSay(s)},
charm(){botSay(`네 매력은 <b>${CHARM[C.ds]}</b>이야.<br><br>${C.dh?'게다가 팔자에 도화(桃花)가 있어. 가만히 있어도 눈길을 끄는 타입이라, 생각보다 너를 지켜보는 사람이 많아.':'팔자에 도화는 없지만, 그래서 오래 볼수록 반하게 되는 타입이야. 첫인상보다 알수록 매력이 커져.'}<br><br>매력이 가장 빛나는 때는 도화가 피는 달이야. ${C.dm.length?C.dm.map(ym).join(', ')+'을 기억해 둬.':'앞으로 1년 안에는 그 달이 없지만, 대신 꾸준함이 무기야.'}`)},
gung(){const d=say('그 사람 생년월일을 알려줘. 시간은 몰라도 괜찮아.<br><input type="date" class="pd" style="margin:8px 0"><button class="btn pgo" style="margin-top:4px;padding:10px;font-size:15px">궁합 보기</button>','bot');
const bt=d.querySelector('.pgo');
bt.onclick=()=>{const v=d.querySelector('.pd').value;if(!v){alert('생년월일을 입력해줘');return}
\const [y,m,dd]=v.split('-').map(Number);bt.disabled=true;say(`${y}년 ${m}월 ${dd}일생이야`,'me');gungRes(calc(y,m,dd,12,0,false))}}
};
function gungRes(Q){
const a=C.ds,b=Q.d[0],x=C.db,y=Q.d[1];let s=50,t=[];
if((b-a+10)%10===5){s+=25;t.push('두 사람의 일간이 합(合)을 이뤄. 처음부터 강하게 끌리는 사이야.')}
if((13-x)%12===y){s+=20;t.push('배우자 자리끼리 합이야. 함께 있으면 편안하고 오래가기 좋아.')}
if((y-x+12)%12===6){s-=15;t.push('배우자 자리끼리 충(沖)이야. 끌리는 만큼 자주 부딪힐 수 있으니 말조심이 필요해.')}
if((se(b)-se(a)+5)%5===C.star){s+=15;t.push('그 사람이 네 인연의 별 기운을 가졌어. 연인으로서 잘 맞는 기운이야.')}
const r=(se(b)-se(a)+5)%5;
if(r===0){s+=5;t.push('같은 오행이라 친구처럼 편한 사이야.')}
else if(r===1||r===4){s+=10;t.push('오행이 서로 살려주는 상생 관계야. 함께 있으면 서로 힘이 돼.')}
const zb=Q.y[1];if((13-C.yb)%12===zb||(SAM[C.yb%4].includes(zb)&&C.yb!==zb)){s+=10;t.push('띠끼리도 잘 맞아.')}
s=Math.max(12,Math.min(98,s));
const v=s>=85?'실이 단단하게 묶인 인연이야.':s>=70?'잘 맞는 편이야. 조금만 노력하면 오래갈 수 있어.':s>=50?'무난한 궁합이야. 서로 다른 점을 이해하는 게 열쇠야.':'쉽지 않은 궁합이야. 대신 서로 배울 게 많은 사이야.';
botSay(`두 사람의 궁합은 <b class="em">${s}점</b>. ${v}<br><br>${t.length?t.join('<br><br>'):'특별히 끌어당기거나 부딪히는 기운은 없어. 관계는 둘이 만들어 가기 나름이야.'}<br><br>그 사람은 <b>${G[b]}(${GK[b]})</b> 일간이야. ${STYLE[b][0]}`);
}
</script>
